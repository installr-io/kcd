name: Build kcd

on:
    push:
        branches: ["main"]
    
    pull_request:
        branches: ["main"]

jobs:
    build:
        permissions:
            contents: read
            packages: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  server-id: "installr-io-maven-repo"

            - name: Build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: mvn -B clean package

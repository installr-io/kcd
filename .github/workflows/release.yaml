name: Release kcd

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

env:
    REGISTRY: ghcr.io

jobs:
    build-and-package:
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  server-id: "installr-io-maven-repo"

            - name: Log into registry ${{ env.REGISTRY }}
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: mvn -B clean deploy

            - name: Upload IPF
              uses: actions/upload-artifact@v6
              with:
                  name: kcd-ipf
                  path: target/kcd-*.ipf
                  if-no-files-found: error
                  overwrite: true

    create-release:
        needs: build-and-package
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Download IPF
              uses: actions/download-artifact@v8
              with:
                  name: kcd-ipf

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
              run: |
                latest=$( gh release view --repo="$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true )
                newest=$( printf '%s\n' "$latest" "$tag" | sort -V | tail -1 )
                gh release create \
                    --repo="$GITHUB_REPOSITORY" \
                    --title="${tag}" \
                    --latest=$( [ "$newest" = "$tag" ] && echo true || echo false ) \
                    --generate-notes \
                    --verify-tag \
                    "$tag" ./kcd-*.ipf

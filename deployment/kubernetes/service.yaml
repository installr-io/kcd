apiVersion: v1
kind: Service
metadata:
    namespace: \${namespace}
    name: ${project.name}
    labels:
        app.kubernetes.io/name: ${project.name}
        app.kubernetes.io/instance: ${project.name}
        app.kubernetes.io/version: ${project.version}
        app.kubernetes.io/managed-by: Installr
spec:
    ports:
        - name: http
          port: 80
          targetPort: 8080
          nodePort: \${port}
    selector:
        app.kubernetes.io/instance: ${project.name}
    type: NodePort
